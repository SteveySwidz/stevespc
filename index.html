<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Steve's Computers</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Bangers&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }
    html {
      color-scheme: dark;
    }
    html, body {
      height: 100%;
      margin: 0;
    }
    body {
      background:
        radial-gradient(ellipse 80% 60% at 50% 40%, rgba(184, 77, 15, 0.10), transparent 70%),
        #0a0a0a;
      color: #f2f2f2;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.6rem;
      max-width: 34rem;
      animation: rise 1.4s ease-out both;
    }

    .brand {
      font-family: 'Bangers', cursive;
      font-weight: 400;
      font-size: clamp(2.4rem, 7vw, 3.4rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #f59747;
      text-shadow:
        0 0 14px rgba(217, 119, 58, 0.55),
        3px 3px 0 rgba(184, 77, 15, 0.6);
      transform: rotate(-2deg);
      display: inline-block;
      margin-bottom: -0.4rem;
    }

    .divider {
      width: 88px;
      height: 1px;
      position: relative;
      background: rgba(184, 77, 15, 0.3);
      overflow: hidden;
    }

    .divider::after {
      content: '';
      position: absolute;
      top: 0;
      left: -70%;
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, transparent, #d9773a, transparent);
      animation: sweep 5s ease-in-out infinite;
    }

    @keyframes sweep {
      0%, 100% {
        left: -70%;
      }
      50% {
        left: 100%;
      }
    }

    .contact {
      margin-top: 0.4rem;
      display: flex;
      flex-direction: column;
      gap: 1.1rem;
    }

    .email {
      font-weight: 500;
      font-size: clamp(1rem, 2.4vw, 1.2rem);
      letter-spacing: 0.02em;
    }

    a.email-link {
      color: #f2f2f2;
      text-decoration: none;
      border-bottom: 1px solid rgba(242, 242, 242, 0.35);
      padding-bottom: 2px;
      transition: color 0.25s ease, border-color 0.25s ease;
    }

    a.email-link:hover {
      color: #d9773a;
      border-color: #d9773a;
    }

    .reviews {
      font-weight: 300;
      font-size: clamp(0.85rem, 2vw, 0.95rem);
      letter-spacing: 0.04em;
    }

    a.reviews-link {
      color: #429ED7;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: rgba(66, 158, 215, 0.55);
      transition: color 0.25s ease, text-decoration-color 0.25s ease;
    }

    a.reviews-link:hover {
      color: #6fb8e6;
      text-decoration-color: #6fb8e6;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .divider::after {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Steve's Computers</div>
    <div class="divider"></div>
  </div>
</body>
</html>
